name: Check for differences from the previous lint rule

on:
  pull_request:
    branches:
      - "main"

jobs:
  auto-approve:
    if: contains(github.head_ref, vars.AUTO_UPDATE_BRANCH_NAME)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      DIFF_FILE: diff.txt
      PROGRAM_DIR: tool/tools/check_lint_rules_identity
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          path: lint
          persist-credentials: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ymm-oss/flutter-yumemi-lints-tools
          path: tool
          persist-credentials: false

      - name: Set up Dart
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        env:
          # https://mise.jdx.dev/configuration/settings.html#locked
          MISE_LOCKED: "1"
          # https://mise.jdx.dev/configuration/settings.html#safe
          MISE_SAFE: "1"
        with:
          working_directory: tool

      - name: Install dependencies
        run: dart pub get
        shell: bash
        working-directory: ${{ env.PROGRAM_DIR }}

      - name: Create diff.txt
        run: git diff --name-only origin/main > ${{ github.workspace }}/${{ env.DIFF_FILE }}
        working-directory: "lint"

      - name: Run check_lint_rules_identity
        run: dart run ${{ env.PROGRAM_DIR }}/bin/check_lint_rules_identity.dart ${{ env.DIFF_FILE }} lint/lib
        shell: bash
        id: identity
        continue-on-error: true

      - name: Approve the checked commit
        if: steps.identity.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKED_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          if [ "$current_sha" != "$CHECKED_SHA" ]; then
            echo "Pull request head changed while checking lint rules."
            echo "Checked: ${CHECKED_SHA}"
            echo "Current: ${current_sha}"
            exit 1
          fi
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            -f commit_id="${CHECKED_SHA}" \
            -f event="APPROVE" \
            -f body="Approved. Because it is the same lint rule as the previous version."

name: Update Lint Rules

on:
  workflow_dispatch:
  schedule:
    # Schedule at 9 AM JST (0 AM UTC) every Friday
    - cron: '0 0 * * 5'

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      PROGRAM_DIR: tool/tools/update_lint_rules
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: lint

      - name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.CLIENT_ID_OF_YMM_OSS_PR_CREATOR }}
          private-key: ${{ secrets.APP_PRIVATE_KEY_OF_YMM_OSS_PR_CREATOR }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ymm-oss/flutter-yumemi-lints-tools
          # main at 2026-11-04. Includes the test-reporter 3.2.0 update.
          ref: 478ce925f87b82ada6635a2f46011d937dbdba42
          path: tool
          persist-credentials: false

      - name: Set up Dart
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        env:
          # https://mise.jdx.dev/configuration/settings.html#locked
          MISE_LOCKED: "1"
          # https://mise.jdx.dev/configuration/settings.html#safe
          MISE_SAFE: "1"
        with:
          working_directory: tool

      - name: Install dependencies
        run: dart pub get
        shell: bash
        working-directory: ${{ env.PROGRAM_DIR }}

      - name: Run update_lint_rules
        run: dart run ${{ env.PROGRAM_DIR }}/bin/update_lint_rules.dart ${{ github.workspace }}/lint/lib
        shell: bash

      - name: Create a pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          path: lint
          token: ${{ steps.app-token.outputs.token }}
          author: 'GitHub <noreply@github.com>'
          commit-message: 'auto: Update lint rules'
          title: Update lint rules
          body: This was automatically generated by the [${{ github.workflow }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          base: main
          branch: ${{ vars.AUTO_UPDATE_BRANCH_NAME }}
          branch-suffix: short-commit-hash

name: Push Tag

on:
  pull_request:
    types:
      - closed
    branches:
      - "main"

permissions:
  contents: read

jobs:
  push-tag:
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-24.04
    steps:
      - name: Generate a token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CLIENT_ID_OF_YMM_OSS_TAG_PUSHER }}
          private-key: ${{ secrets.APP_PRIVATE_KEY_OF_YMM_OSS_TAG_PUSHER }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.generate_token.outputs.token }}
      - name: Extract a version
        id: extract_version
        run: |
          version=$(echo ${{ github.head_ref }} | sed -e 's/release\///')
          # Check version
          # See: https://github.com/dart-lang/pub_semver/blob/3175ba0a58a96fb23f8d68b5f5c44d1a5b30cc16/lib/src/patterns.dart#L6-L9
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$ ]]; then
              echo "Invalid version format: $version"
              exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Push a tag
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"
        env:
          VERSION: ${{ steps.extract_version.outputs.version }}
